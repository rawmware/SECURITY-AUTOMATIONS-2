name: brute-force-response
description: Block the attacking IP, notify the SOC, and open a case when auth_watch reports brute-force login activity.
trigger:
  engines: [auth_watch]
  min_severity: high
steps:
  - action: block_ip
    params:
      ip: "{ip}"
      duration: "24h"
  - action: notify
    params:
      channel: "security-ops"
      message: "Blocked {ip} after brute-force login attempts against {user}."
  - action: open_case
    params:
      title: "Brute-force campaign against {user}"
      severity: "high"

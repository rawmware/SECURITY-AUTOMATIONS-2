name: cloud-misconfig-remediate
description: Notify cloud ops, open a case, and ticket remediation for a cloud misconfiguration.
trigger:
  engines: [cloud_posture]
  min_severity: high
steps:
  - action: notify
    params:
      channel: "cloud-ops"
      message: "Misconfiguration detected on {resource}; remediation needed."
  - action: open_case
    params:
      title: "Cloud misconfiguration: {resource}"
      severity: "high"
  - action: create_ticket
    params:
      system: "jira"
      title: "Remediate misconfigured resource {resource}"

name: phishing-containment
description: Block the phishing source IP, isolate the affected host (requires human approval), and notify the SOC.
trigger:
  engines: [phish_kit, url_intel]
  min_severity: high
steps:
  - action: block_ip
    params:
      ip: "{ip}"
      duration: "72h"
  - action: isolate_host
    approval_required: true
    params:
      host: "{host}"
  - action: notify
    params:
      channel: "security-ops"
      message: "Phishing containment: blocked {ip}; isolation of {host} pending approval."

name: secret-leak-rotation
description: Revoke an exposed credential immediately, notify the SOC, and open a critical case.
trigger:
  engines: [secret_sentry]
  min_severity: critical
steps:
  - action: revoke_token
    params:
      token_id: "{token_id}"
  - action: notify
    params:
      channel: "security-ops"
      message: "Revoked leaked credential {token_id}; verify rotation completed."
  - action: open_case
    params:
      title: "Secret leaked: {token_id}"
      severity: "critical"

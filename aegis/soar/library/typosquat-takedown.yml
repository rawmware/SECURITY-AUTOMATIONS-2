name: typosquat-takedown
description: File a registrar abuse ticket for a typosquatting domain, notify the SOC, and open a brand-protection case.
trigger:
  engines: [typo_watch]
  min_severity: high
steps:
  - action: create_ticket
    params:
      system: "registrar"
      title: "Takedown request: {domain} (typosquat of brand)"
  - action: notify
    params:
      channel: "security-ops"
      message: "Filed takedown for typosquat domain {domain}; monitoring for clones."
  - action: open_case
    params:
      title: "Typosquatting: {domain}"
      severity: "high"

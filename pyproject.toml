[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-security"
version = "2.0.0"
description = "Aegis — Autonomous Enterprise Security Grid (proprietary)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Roman's Proposal" }]
keywords = ["security", "detection", "soar", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
